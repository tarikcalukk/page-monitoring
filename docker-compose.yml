services:
  api:
    build:
      context: ./server
    image: page-monitoring-api:local
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-development-only}
      JWT_EXPIRES_IN: 2h
      DATA_FILE: /app/data/users.json
      LOG_LEVEL: info
      EMAIL_DELIVERY_MODE: smtp
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_SECURE: "false"
      EMAIL_FROM: "Page Monitoring <no-reply@page-monitoring.local>"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    user: root
    command: sh -c "chown -R node:node /app/data && chmod -R u+w /app/data && exec su node -c 'npm start'"
    volumes:
      - page_monitoring_data:/app/data
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    image: page-monitoring-client:local
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  page_monitoring_data:
