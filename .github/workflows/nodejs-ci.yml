name: Backend CI

on:
  push:
    branches: ["fix/backend-structure", "master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length
      DATA_FILE: users.ci.json
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
